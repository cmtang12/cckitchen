<!DOCTYPE html>
<html>
<head>
  <title>Test Recipe Extraction</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
    }
    textarea {
      width: 100%;
      height: 300px;
      padding: 10px;
      font-family: monospace;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    .results {
      margin-top: 20px;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 8px;
    }
    .section {
      margin: 20px 0;
    }
    pre {
      background: white;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Test Instagram Recipe Extraction</h1>
  
  <div>
    <h2>Sample Instagram Recipe Text:</h2>
    <textarea id="recipeText">Creamy Garlic Parmesan Chicken

Ingredients:
- 4 chicken breasts
- 2 tbsp olive oil
- 4 cloves garlic, minced
- 1 cup heavy cream
- 1/2 cup parmesan cheese
- Salt and pepper to taste
- Fresh parsley for garnish

Instructions:
1. Season chicken with salt and pepper
2. Heat olive oil in a large skillet over medium-high heat
3. Cook chicken for 6-7 minutes per side until golden brown
4. Remove chicken and set aside
5. In the same pan, add garlic and cook for 1 minute
6. Add heavy cream and parmesan, stir until sauce thickens
7. Return chicken to pan and coat with sauce
8. Garnish with fresh parsley and serve

Serves: 4
Cook time: 25 minutes</textarea>
  </div>

  <button onclick="testExtraction()">Test Extraction</button>

  <div class="results" id="results" style="display: none;">
    <h2>Extraction Results:</h2>
    <div id="output"></div>
  </div>

  <script>
    async function testExtraction() {
      const text = document.getElementById('recipeText').value;
      const resultsDiv = document.getElementById('results');
      const outputDiv = document.getElementById('output');

      resultsDiv.style.display = 'block';
      outputDiv.innerHTML = '<p>Processing...</p>';

      try {
        // You'll need to update this URL to match your Supabase project
        const response = await fetch('http://localhost:54321/functions/v1/make-server-9a4224b7/parse-recipe-text', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            text: text,
            sourceUrl: 'https://instagram.com/test'
          })
        });

        const data = await response.json();

        outputDiv.innerHTML = `
          <div class="section">
            <h3>Name:</h3>
            <pre>${data.name || '(not found)'}</pre>
          </div>
          
          <div class="section">
            <h3>Servings:</h3>
            <pre>${data.servings || '(not found)'}</pre>
          </div>
          
          <div class="section">
            <h3>Cooking Time:</h3>
            <pre>${data.cookingTime ? data.cookingTime + ' minutes' : '(not found)'}</pre>
          </div>
          
          <div class="section">
            <h3>Ingredients (${data.ingredients?.length || 0}):</h3>
            <pre>${JSON.stringify(data.ingredients, null, 2)}</pre>
          </div>
          
          <div class="section">
            <h3>Instructions (${data.instructions?.length || 0}):</h3>
            <pre>${JSON.stringify(data.instructions, null, 2)}</pre>
          </div>
          
          <div class="section">
            <h3>Full Response:</h3>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          </div>
        `;

      } catch (error) {
        outputDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
